# Packaging config for electron-builder. Run `npm run package -w @sonobe/desktop` (scripts/package.mjs):
# it builds the editor, the desktop bundles, the CLI and the icons first, then packages. What is built
# and how it is signed is decided there, not here: a local ad-hoc build by default, a rehearsal with
# --identity, the notarized Developer ID build with --release (scripts/signing.ts).
appId: dev.sonobe.app
productName: Sonobe
copyright: Copyright © 2026 Sonobe contributors
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Where releases live. Nothing is ever published from a build (scripts/package.mjs always passes
# publish: "never", and the release workflow uploads the files itself). This block is what puts the feed's
# address into the app (Resources/app-update.yml) and, with the zip target, writes latest-mac.yml and the
# blockmaps an update is downloaded with. 0.2.0, the first release, froze it: installed apps look here.
publish:
  provider: github
  owner: thats2easyyy
  repo: sonobe

directories:
  output: release
  # icon.icns, icon.ico, icon.png and icons/ come from scripts/icons.mjs.
  buildResources: build

# main.cjs, preload.cjs and the player and scene pages are fully bundled, so no node_modules ship in the app.
files:
  - dist/**/*
  - "!dist/**/*.map"
  - "!dist/cli/**"
  - "!dist/bin/**"
  - "!dist/licenses/**"
  - package.json
  - "!node_modules/**/*"

extraResources:
  # The editor build, loaded from Resources/editor/index.html when packaged. Its source maps stay out of
  # the app (17 MB that only DevTools reads); a release collects them into Sonobe-<version>-sourcemaps.tar.gz.
  - from: ../editor/dist
    to: editor
    filter:
      - "**/*"
      - "!**/*.map"
  # The `sonobe` CLI: Resources/cli/sonobe runs sonobe.mjs with the app's runtime in Node mode, and relay.mjs
  # (the relay alone) for `sonobe mcp`.
  - from: dist/cli
    to: cli
    filter:
      - "**/*"
  # Sonobe's license and the notices of every bundled npm package (scripts/build.mjs --licenses). On macOS
  # scripts/package.mjs adds Electron's and Chromium's licenses to the folder, from the Electron it packages.
  - from: dist/licenses
    to: licenses
    filter:
      - "**/*"

asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

fileAssociations:
  - ext: sonobe
    name: Sonobe Prototype
    description: Sonobe prototype project
    role: Editor
    rank: Owner
    # macOS: a *.sonobe folder behaves like a document in Finder.
    isPackage: true
    mimeType: application/x-sonobe

mac:
  category: public.app-category.graphics-design
  darkModeSupport: true
  icon: build/icon.icns
  # No minimumSystemVersion: the floor is Electron's own (macOS 13 for Electron 44), so it can never be
  # lower than what the framework runs on.
  # What macOS shows when a prototype first asks for the camera or the microphone. Electron's other usage
  # strings (Bluetooth, audio capture) stay: an unused one is harmless, a missing one ends the app.
  extendInfo:
    NSCameraUsageDescription: Prototypes that use the Camera patch show your camera in the viewer.
    NSMicrophoneUsageDescription: Prototypes that use the Microphone patch listen through your microphone.
  # The app is English only, so Chromium's other 219 locale folders (48 MB) stay out. Under mac, not at the
  # top level: there the same setting would delete en-US.pak, the only English locale, on Windows and Linux.
  electronLanguages:
    - en
  # No identity, hardenedRuntime, notarize or entitlements here: scripts/package.mjs passes them for the
  # build it was asked for, and a value set here couldn't be unset from there (`identity: "-"` would
  # override any certificate). The entitlement files are build/entitlements.mac.plist for the app and
  # build/entitlements.mac.inherit.plist for everything inside it.
  # The SF Symbols helper (native/sfsymbol, compiled by scripts/build.mjs): Resources/bin/sfsymbol draws
  # SF Symbols for design imports. It can't run from inside app.asar, so it ships as a resource.
  extraResources:
    - from: dist/bin
      to: bin
      filter:
        - sfsymbol
  # What a release builds, for arm64 and x64; scripts/package.mjs always names the targets and
  # architectures of the run itself (a local build is one DMG for this machine).
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  sign: false
  writeUpdateInfo: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  icon: build/icons
  executableName: sonobe
  category: Graphics
  synopsis: Interaction prototyping with layers, patches, and a live viewer
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
