<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Sonobe</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        var pref = "dark";
        try {
          pref = localStorage.getItem("sonobe.theme") || "dark";
        } catch (e) {}
        var theme =
          pref === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : pref === "light"
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
      // Apply the saved motion preference (Settings → Motion) before first paint, too.
      (function () {
        var motion = "system";
        try {
          motion = (JSON.parse(localStorage.getItem("sonobe.settings.v1") || "{}") || {}).motion || "system";
        } catch (e) {}
        var reduce = motion === "reduce" || (motion === "system" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.setAttribute("data-motion", reduce ? "reduce" : "full");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
