<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
  body { margin: 0; background: #F2F2F7; font-family: -apple-system, system-ui, sans-serif; }
  header { padding: 60px 20px 12px; }
  header h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.4px; }
  .search { margin: 12px 16px 0; background: rgba(118,118,128,.12); border-radius: 10px; height: 36px; display: flex; align-items: center; padding: 0 8px; gap: 6px; }
  .search input { border: 0; background: transparent; font-size: 17px; flex: 1; outline: none; font-family: inherit; }
  .group { margin: 24px 16px 0; background: white; border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; height: 44px; padding-left: 16px; }
  .row .icon { width: 29px; height: 29px; border-radius: 7px; margin-right: 12px; flex: none; }
  .row .label { flex: 1; font-size: 17px; height: 44px; display: flex; align-items: center; border-bottom: 0.5px solid rgba(60,60,67,.29); padding-right: 16px; }
  .row:last-child .label { border-bottom: 0; }
  .value { color: rgba(60,60,67,.6); margin-left: auto; }
  .toggle { margin-left: auto; width: 51px; height: 31px; border-radius: 16px; background: #34C759; position: relative; }
  .toggle::after { content: ""; position: absolute; width: 27px; height: 27px; top: 2px; right: 2px; background: white; border-radius: 50%; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
  .toggle.off { background: rgba(120,120,128,.16); }
  .footnote { font-size: 13px; color: rgba(60,60,67,.6); margin: 8px 32px; }
  .danger { color: #FF3B30; justify-content: center; }
</style>
</head>
<body>
  <header><h1>Settings</h1></header>
  <label class="search"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#8E8E93" stroke-width="2"/><path d="M11 11l3 3" stroke="#8E8E93" stroke-width="2"/></svg><input placeholder="Search"></label>
  <div class="group">
    <div class="row"><div class="icon" style="background:#FF9500"></div><div class="label">Airplane Mode<div class="toggle off"></div></div></div>
    <div class="row"><div class="icon" style="background:#007AFF"></div><div class="label">Wi-Fi<span class="value">Home Network</span></div></div>
    <div class="row"><div class="icon" style="background:#34C759"></div><div class="label">Notifications<div class="toggle"></div></div></div>
  </div>
  <p class="footnote">Notifications appear on the Lock Screen and in Notification Center.</p>
  <div class="group">
    <div class="row"><div class="label">Email</div></div>
    <div class="row" style="height:auto; padding: 8px 16px"><input type="email" value="ava@example.com" style="width:100%; font-size:17px; border:1px solid #D1D1D6; border-radius:8px; padding:8px; font-family:inherit"></div>
    <div class="row"><div class="label danger">Sign Out</div></div>
  </div>
</body>
</html>
