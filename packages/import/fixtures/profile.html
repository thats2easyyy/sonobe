<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>
<style>
  :root { --ink: oklch(0.21 0.02 265); --muted: oklch(0.55 0.02 265); --brand: oklch(0.62 0.21 259); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F5F7; color: var(--ink); }
  .cover { height: 180px; background: linear-gradient(135deg, #FF9A62, #FF3D71 55%, #7C3AED); }
  .card { margin: -64px 16px 0; background: white; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(17, 24, 39, 0.12), 0 1px 2px rgba(17,24,39,.08); position: relative; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; border: 4px solid white; margin-top: -64px; object-fit: cover; display: block; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  h1 { font-size: 24px; margin: 12px 0 2px; letter-spacing: -0.02em; }
  .handle { color: var(--muted); font-size: 15px; margin: 0; }
  .bio { font-size: 15px; line-height: 1.45; margin: 12px 0 16px; }
  .bio b { color: var(--brand); }
  .stats { display: flex; gap: 8px; }
  .stat { flex: 1; background: #F5F5F7; border-radius: 14px; padding: 10px 12px; }
  .stat strong { display: block; font-size: 18px; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; height: 44px; border-radius: 12px; border: 0; font: 600 16px/1 inherit; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--brand); color: white; }
  .btn-secondary { background: white; color: var(--ink); border: 1px solid #E5E7EB; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin: 24px 20px 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 16px 120px; }
  .grid div { aspect-ratio: 1; border-radius: 6px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,.08); display: flex; justify-content: space-around; padding-top: 10px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .tab.active { color: var(--brand); }
  .badge { position: absolute; top: 20px; right: 20px; background: oklch(0.93 0.05 150); color: oklch(0.45 0.12 150); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="cover"></div>
  <section class="card" data-name="Profile Card">
    <img class="avatar" alt="Ava Chen" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237DD3FC'/><stop offset='1' stop-color='%235B5CF6'/></linearGradient></defs><rect width='200' height='200' fill='url(%23g)'/><circle cx='100' cy='80' r='36' fill='white' opacity='.9'/><rect x='40' y='130' width='120' height='70' rx='35' fill='white' opacity='.9'/></svg>">
    <span class="badge">Online</span>
    <h1>Ava Chen</h1>
    <p class="handle">@avachen · San Francisco</p>
    <p class="bio">Product designer making tools for <b>interaction prototyping</b>. Previously at a few places you've heard of.</p>
    <div class="stats">
      <div class="stat"><strong>248</strong><span>Posts</span></div>
      <div class="stat"><strong>12.4k</strong><span>Followers</span></div>
      <div class="stat"><strong>318</strong><span>Following</span></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="follow-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Follow
      </button>
      <button class="btn btn-secondary" aria-label="Message">Message</button>
    </div>
  </section>
  <div class="section-title">Recent</div>
  <div class="grid">
    <div style="background: linear-gradient(to bottom, #FDE68A, #F59E0B)"></div>
    <div style="background: radial-gradient(circle at 30% 30%, #86EFAC, #14B8A6)"></div>
    <div style="background: #C4B5FD"></div>
    <div style="background: #FBCFE8"></div>
    <div style="background: linear-gradient(45deg, #BAE6FD, #0284C7)"></div>
    <div style="background: #FCA5A5"></div>
  </div>
  <nav class="tabbar">
    <a class="tab"><svg class="lucide lucide-home" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="tab"><svg class="lucide lucide-search" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</a>
    <a class="tab active" href="#"><svg class="lucide lucide-user" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>
</body>
</html>
